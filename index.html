    <script>
      // Start the hero photo (the LCP image) before main.js has loaded. The map
      // must match AUDIENCES[*].hero.photo (tests/hero-preload.test.mjs).
      (function () {
        var M = {"general":"20210810_184724.jpg","families":"napros/20210918_155653.jpg","cyclists":"napros/20210918_110141.jpg","retreats":"20210720_171634.jpg","kite":"napros/20210918_155421.jpg","reunion":"grillarea.jpg","remote":"app2-terrace.jpg","wellness":"napros/20210918_155653.jpg","nature":"napros/20210918_110141.jpg","dogs":"napros/20210720_171714.jpg","naturists":"napros/20210918_152134.jpg","fieldtrips":"napros/20210918_155421.jpg"};
        var q = new URLSearchParams(location.search), s = {};
        try { s = JSON.parse(localStorage.getItem('visit-sabunike:state:v1') || '{}'); } catch (e) {}
        var a = String(q.get('for') || q.get('audience') || s.audience || 'general').toLowerCase();
        if ((q.get('hero') || s.hero || 'photo') === 'villa3d') return;
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.fetchPriority = 'high';
        l.href = './photos/web/' + (M[a] || M.general);
        document.head.appendChild(l);
      })();
    </script>
